<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | Streamflix</title><link rel="stylesheet" href="css/style.css"><script>
(function(){
  if(sessionStorage.getItem('streamflix_admin_auth')==='1'){
    location.replace('admin.html');
    return;
  }
  if(localStorage.getItem('streamflixLoggedIn')==='true'){
    location.replace('profiles.html');
  }
})();
</script><script>if(localStorage.getItem('sfTheme')==='light')document.documentElement.classList.add('sf-light');</script></head><body><div class="auth-page"><header class="auth-header"><a class="auth-logo" href="index.html">STREAMFLIX</a><a class="btn outline" href="login.html">Sign In</a></header><main class="auth-main"><form class="auth-box" data-auth><h1>Create Account</h1><div class="form-group"><label>Name</label><input name="name" required placeholder="Your name"></div><div class="form-group"><label>Email</label><input type="email" required placeholder="Email address"></div><div class="form-group"><label>Password</label><input type="password" required placeholder="Create a password"></div><button class="auth-submit">Create Account</button><p class="auth-small">Already have an account? <a href="login.html">Sign in.</a></p></form></main></div><script src="js/app.js"></script><script src="js/movie-data.js"></script><script src="js/admin-sync.js"></script><script src="js/artwork.js"></script><script>
(function(){
  const email=document.querySelector('input[type="email"]');
  const pending=sessionStorage.getItem('streamflixPendingEmail');
  if(email && pending){ email.value=pending; sessionStorage.removeItem('streamflixPendingEmail'); }
})();
</script><script src="js/auth.js"></script><script src="js/enhancer.js"></script><script src="js/premium-ux.js"></script></body></html>
